<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <a href="task2.html" class="navbar-brand fs-3 fw-bold">My Website</a>

            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item">
                    <a href="task0.html" class="nav-link">Task 0</a>
                </li>
                <li class="nav-item">
                    <a href="task1.html" class="nav-link">Task 1</a>
                </li>
                <li class="nav-item">
                    <a href="task2.html" class="nav-link">Task 2</a>
                </li>
                <li class="nav-item">
                    <a href="task3.html" class="nav-link">Task 3</a>
                </li>
                <li class="nav-item">
                    <a href="task4.html" class="nav-link">Task 4</a>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <h1 class="mt-4 fw-bold">Registration Form</h1>
        <p>Please fill out this form with the required information</p>

        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <div class="reg-form">
                        <form action="#">

                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Full Name</label>
                                <input type="text" id="name" class="form-control is-valid" name="name" placeholder="Write here" required minlength="8">
                                <div class="valid-feedback">
                                    Great!
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email address</label>
                                <input type="email" id="email" class="form-control is-invalid" name="email"
                                    placeholder="Write here" required maxlength="15">
                                    <div class="invalid-feedback">
                                        Please enter a valid email
                                    </div>
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label fw-bold">Message</label>
                                <textarea id="message" class="form-control is-invalid" name="message"
                                    placeholder="Write your message" required></textarea>

                                    <div class="invalid-feedback">
                                        Bro please write something
                                    </div>
                            </div>

                            <div class="buttons">
                                <button type="submit" class="btn btn-primary">SUBMIT</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
