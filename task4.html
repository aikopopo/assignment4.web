<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advanced Form Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <a href="task2.html" class="navbar-brand fs-3 fw-bold">My Website</a>

            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item">
                    <a href="task0.html" class="nav-link">Task 0</a>
                </li>
                <li class="nav-item">
                    <a href="task1.html" class="nav-link">Task 1</a>
                </li>
                <li class="nav-item">
                    <a href="task2.html" class="nav-link">Task 2</a>
                </li>
                <li class="nav-item">
                    <a href="task3.html" class="nav-link">Task 3</a>
                </li>
                <li class="nav-item">
                    <a href="task4.html" class="nav-link">Task 4</a>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <h1 class="mt-4 fw-bold">Registration Form</h1>
        <p>Please fill out this form with the required information</p>

        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <div class="reg-form">
                        <form action="#">

                            <div class="mb-3">
                                <label for="fstname" class="form-label fw-bold">First Name</label>
                                <input type="text" id="fstname" class="form-control is-valid" name="name"
                                    placeholder="Write here" required minlength="5">
                                <div class="valid-feedback">
                                    Great!
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="ltname" class="form-label fw-bold">Last Name</label>
                                <input type="text" id="ltname" class="form-control is-valid" name="lastname"
                                    placeholder="Write here" required minlength="5">
                                <div class="valid-feedback">
                                    Great Bro!
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email address</label>
                                <input type="email" id="email" class="form-control is-invalid" name="email"
                                    placeholder="Write here" required maxlength="15">
                                <div class="invalid-feedback">
                                    Please enter a valid email
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" id="password" class="form-control is-invalid" name="password"
                                    placeholder="Write here" required minlength="8">
                                <div class="invalid-feedback">
                                    Please enter valid password with 8 characters
                                </div>
                            </div>

                            <div class="mb-5">
                                <label for="confirmPassword" class="form-label fw-bold">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control" name="confirmPassword"
                                    placeholder="Confirm your password" required minlength="8">
                            </div>



                            <hr>



                            <div class="pt-3 mb-3">
                                <label class="form-label fw-bold">Your gender</label>

                                <div class="d-flex justify-content-center gap-3">
                                    <div>
                                        <label for="female">female</label>
                                        <input type="radio" id="female" class="form-check" name="gender" value="female"
                                            required>
                                    </div>

                                    <div>
                                        <label for="male">male</label>
                                        <input type="radio" id="male" class="form-check" name="gender" value="male"
                                            required>
                                    </div>
                                </div>

                            </div>


                            <hr>


                            <div class="pt-3 mb-2">
                                <label class="form label fw-bold">Choose your hobbies</label>

                                <div class="d-flex justify-content-center gap-3">
                                    <div>
                                        <input type="checkbox" id="reading" class="form-check" name="hobbies" checked />
                                        <label for="reading">Reading</label>
                                    </div>

                                    <div>
                                        <input type="checkbox" id="dancing" class="form-check" name="hobbies" />
                                        <label for="dancing">Dancing</label>
                                    </div>

                                    <div>
                                        <input type="checkbox" id="watchingm" class="form-check" name="hobbies"
                                            checked />
                                        <label for="watchingm">Watching Movies</label>
                                    </div>

                                    <div>
                                        <input type="checkbox" id="coding" class="form-check" name="hobbies" checked />
                                        <label for="coding">Coding</label>
                                    </div>

                                    <div>
                                        <input type="checkbox" id="travelling" class="form-check" name="hobbies"
                                            checked />
                                        <label for="travelling">Travelling</label>
                                    </div>

                                    <div>
                                        <input type="checkbox" id="playinggsh" class="form-check" name="hobbies"
                                            checked />
                                        <label for="playinggsh">Playing Genshin Impact</label>
                                    </div>
                                </div>
                            </div>


                            <hr>


                            <div class="pt-3 mb-3">
                                <label class="form label fw-bold">Choose your country</label>

                                <select name="countries" id="country" class="form-select" required>
                                    <option value="">Please choose one option</option>
                                    <option value="kazakhstan">Kazakhstan</option>
                                    <option value="united States">United States</option>
                                    <option value="united Kingdom">United Kingdom</option>
                                    <option value="italy">Italy</option>
                                    <option value="japan">Japan</option>
                                    <option value="china">China</option>
                                    <option value="spain">Spain</option>
                                </select>
                            </div>


                            <div class="pt-3">
                                <div class="d-flex justify-content-center gap-3">
                                    <div class="buttons">
                                        <button type="submit" class="btn btn-primary">SUBMIT</button>
                                    </div>
                                    <div class="reset">
                                        <button type="reset" class="btn btn-primary">Reset</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
